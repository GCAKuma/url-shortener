name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}  # CI-main (workflow name + branch)
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Version Must match the Dockerfile base image, so we test what we ship.
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

  docker:
    name: Build & smoke test image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: url-shortener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --rm -p 8000:8000 --name smoke url-shortener:${{ github.sha }}

          for _ in $(seq 1 15); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            echo "Container never became healthy:"
            docker logs smoke
            docker stop smoke
            exit 1
          fi

          curl -fs -X POST http://localhost:8000/shorten \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/ci"}' | tee response.json

          grep -q short_code response.json

          docker stop smoke

      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max